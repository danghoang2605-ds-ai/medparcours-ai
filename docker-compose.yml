# MedParcours AI -- run with: docker-compose up --build
#
# Backend (FastAPI) + Frontend (React, esbuild + nginx).
# Stateless backend: no database. Records are stored in the browser.
#
# Requires: .env file with at least ANTHROPIC_API_KEY (see .env.example).

services:
  backend:
    build:
      context: .
      dockerfile: docker_setup/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker_setup/Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
