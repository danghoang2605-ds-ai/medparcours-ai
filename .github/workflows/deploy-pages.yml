name: Deploy MedParcours AI to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'cde/**'
      - '*.py'
      - 'requirements*.txt'
      - 'docker*'
      - 'README.md'
  workflow_dispatch:

# Cấp quyền ghi nội dung để hệ thống tự tạo và cập nhật nhánh gh-pages
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install esbuild@0.27.7 react@19.2.6 react-dom@19.2.6
        env:
          NODE_OPTIONS: "--no-deprecation"

      - name: Prepare build folder
        run: |
          mkdir -p build
          cp App.jsx build/App.jsx
          cp docker_setup/mount.jsx build/mount.jsx

      - name: Build bundle with esbuild
        run: |
          mkdir -p dist
          npx esbuild build/mount.jsx --bundle --loader:.jsx=jsx --jsx=automatic --format=esm --outfile=dist/mount.js --minify

      - name: Copy index.html
        run: cp index.html dist/index.html

      - name: Copy logos folder
        run: |
          mkdir -p dist/logos
          cp -r logos/. dist/logos/ || true

      - name: Copy ECG demo samples folder
        run: |
          mkdir -p dist/ecg_samples
          cp -r ecg_samples/. dist/ecg_samples/ || true

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Thư mục chứa sản phẩm sau khi build xong
          branch: gh-pages # Tự động đẩy toàn bộ file tĩnh sang nhánh này để làm giao diện web
