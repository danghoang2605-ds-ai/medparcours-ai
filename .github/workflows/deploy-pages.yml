name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    # Backend-only changes do not need a frontend rebuild.
    paths-ignore:
      - "cde/**"
      - "*.py"
      - "requirements*.txt"
      - "docker*"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: npm install --no-save esbuild@0.27.7 react@19.2.6 react-dom@19.2.6

      - name: Build static site
        env:
          MEDIFLOW_API_URL: ${{ vars.MEDIFLOW_API_URL }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url }}
    steps:
      # GitHub Pages deploys occasionally fail transiently; retry once.
      - name: Deploy (attempt 1)
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy (attempt 2)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
